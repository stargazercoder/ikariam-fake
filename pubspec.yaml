name: ikariam
description: "Ikariam clone - browser-based city builder with ancient Greek theme."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.12.0
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2
  go_router: ^17.1.0
  flame: ^1.35.1
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  # Note: riverpod_generator ^4.0.x requires analyzer ^9.0.0 which conflicts with
  # flutter_test pinned deps in Dart 3.10.1. Add in a future plan once Dart SDK
  # upgrades to support analyzer ^9.0.0, or use manual provider definitions.
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
