<!DOCTYPE html>
<html>
<head>

    For more details:

<body>
  <div id="splash">

      #splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #1A237E; z-index: 9999; transition: opacity 0.4s ease; }
      #splash h1 { color: #C9A84C; font-family: serif; font-size: 2.5rem; letter-spacing: 0.1em; }
      #splash p { color: rgba(255,255,255,0.6); font-size: 0.9rem; margin-top: 0.5rem; text-align: center; }

    <div style="text-align:center">
