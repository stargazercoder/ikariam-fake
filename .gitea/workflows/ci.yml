name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v1
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true
          cache-dependency-path: pubspec.lock

      - name: Set up Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Deno test
        run: deno test supabase/functions/tests/

      - name: Flutter test
        run: flutter test

  build:
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v1
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true
          cache-dependency-path: pubspec.lock

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Flutter build web
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build web --release --base-href / \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY

      - name: Prepare SSH
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 22 -H 100.101.118.70 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Install rsync
        run: apt-get update && apt-get install -y rsync

      - name: Deploy via rsync
        if: github.event_name != 'pull_request'
        run: |
          rsync -avz --delete -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no" \
            build/web/ \
            hermes@100.101.118.70:/var/www/ikariam-fake/

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          echo "Deployed to https://ikariam-fake.hermes.bilalarikan.com"
          echo "Commit: ${{ gitea.sha }}"
